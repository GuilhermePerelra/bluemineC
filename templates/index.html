Como usar:
- Este é um arquivo estático (index.html). Você pode servir diretamente

  do exemplo por fetch() para os endpoints do seu servlet:

<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>App de Demandas — Template</title>
  <meta name="description" content="Template HTML para gestão de demandas e atribuição de tarefas" />
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --muted:#9aa4b2; --accent:#3b82f6; --success:#10b981; --danger:#ef4444; --glass: rgba(255,255,255,0.03);
      --radius:10px; --maxw:1100px; --gap:14px;
    }
    *{box-sizing:border-box}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,'Helvetica Neue',Arial; margin:0; background:linear-gradient(180deg,#071026 0%,#071526 100%); color:#e6eef6; padding:28px;}
    .wrap{max-width:var(--maxw); margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .small{color:var(--muted);font-size:13px}

    .controls{display:flex;gap:12px;align-items:center}
    .btn{background:var(--accent);border:none;color:white;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06)}

    .grid{display:grid;grid-template-columns:300px 1fr;gap:var(--gap)}
    .panel{background:linear-gradient(180deg,rgba(255,255,255,0.02),var(--glass)); padding:14px;border-radius:var(--radius); box-shadow:0 6px 18px rgba(2,6,23,0.6)}

    /* sidebar */
    .sidebar h3{margin:0 0 10px 0;font-size:14px}
    .filter-group{display:flex;flex-direction:column;gap:8px}
    .select,input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .checkbox-row{display:flex;gap:8px;align-items:center}

    /* main */
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
    .search{display:flex;gap:8px;align-items:center}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
    th{font-size:13px;color:var(--muted)}
    .badge{padding:6px 8px;border-radius:999px;font-weight:700;font-size:12px}
    .status-open{background:rgba(59,130,246,0.12);color:var(--accent)}
    .status-in{background:rgba(245,158,11,0.12);color:#f59e0b}
    .status-done{background:rgba(16,185,129,0.1);color:var(--success)}
    .priority-low{background:rgba(34,197,94,0.08);color:#22c55e}
    .priority-high{background:rgba(239,68,68,0.08);color:var(--danger)}

    .actions button{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:6px}

    /* card view responsive */
    @media(max-width:880px){
      .grid{grid-template-columns:1fr}
      table{display:none}
      .card-list{display:grid;grid-template-columns:1fr;gap:10px}
    }
    .card{background:rgba(255,255,255,0.02);padding:12px;border-radius:10px}
    .meta{display:flex;gap:8px;align-items:center}

    /* modal */
    .modal-back{position:fixed;inset:0;background:rgba(2,6,23,0.7);display:none;align-items:center;justify-content:center;padding:20px}
    .modal{background:#061427;padding:18px;border-radius:10px;max-width:700px;width:100%}
    .form-row{display:flex;gap:10px}
    .form-row > *{flex:1}
    textarea{width:100%;min-height:100px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}

    footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}

  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>App de Demandas</h1>
        <div class="small">Inspiração: Redmine · ClearQuest — template HTML puro</div>
      </div>
      <div class="controls">
        <div class="small">Usuário: <strong>admin</strong></div>
        <button class="btn" id="btnNew">+ Nova Demanda</button>
      </div>
    </header>

    <div class="grid">
      <aside class="panel sidebar">
        <h3>Filtros</h3>
        <div class="filter-group">
          <input type="text" id="q" placeholder="Pesquisar título ou descrição" />

          <label class="small">Status</label>
          <select id="filterStatus" class="select">
            <option value="">Todos</option>
            <option value="open">Pendente</option>
            <option value="in_progress">Em andamento</option>
            <option value="done">Concluído</option>
          </select>

          <label class="small">Prioridade</label>
          <select id="filterPriority" class="select">
            <option value="">Todas</option>
            <option value="low">Baixa</option>
            <option value="medium">Média</option>
            <option value="high">Alta</option>
          </select>

          <label class="small">Responsável</label>
          <select id="filterAssignee" class="select">
            <option value="">Qualquer</option>
          </select>

          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn" id="btnApply">Aplicar</button>
            <button class="btn ghost" id="btnClear">Limpar</button>
          </div>
        </div>
      </aside>

      <main>
        <div class="panel">
          <div class="toolbar">
            <div class="search">
              <input type="text" id="quickSearch" placeholder="Pesquisar..." style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit" />
              <div class="small" style="margin-left:8px">Resultados: <span id="count">0</span></div>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <button class="btn ghost" id="btnRefresh">Refresh</button>
            </div>
          </div>

          <div id="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Título</th>
                  <th>Prioridade</th>
                  <th>Responsável</th>
                  <th>Status</th>
                  <th>Criação</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>

            <div class="card-list" id="cardList" style="display:none"></div>
          </div>

        </div>
      </main>
    </div>

  
  </div>

  <!-- Modal -->
  <div class="modal-back" id="modalBack">
    <div class="modal">
      <h3 id="modalTitle">Nova Demanda</h3>
      <div style="margin-top:10px;">
        <div class="form-row">
          <input id="inpTitle" placeholder="Título" />
          <select id="inpPriority">
            <option value="low">Baixa</option>
            <option value="medium">Média</option>
            <option value="high">Alta</option>
          </select>
        </div>
        <div style="margin-top:8px">
          <textarea id="inpDesc" placeholder="Descrição (opcional)"></textarea>
        </div>
        <div style="margin-top:8px" class="form-row">
          <select id="inpAssignee"></select>
          <select id="inpStatus">
            <option value="open">Pendente</option>
            <option value="in_progress">Em andamento</option>
            <option value="done">Concluído</option>
          </select>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
          <button class="btn ghost" id="btnCancel">Cancelar</button>
          <button class="btn" id="btnSave">Salvar</button>
        </div>
      </div>
    </div>
  </div>

<script>
// Template JS — funcionamento local para demo. Substitua por chamadas ao backend conforme necessário.
const sampleUsers = [
  {id: 'u1', name: 'Alice'},
  {id: 'u2', name: 'Bruno'},
  {id: 'u3', name: 'Carlos'}
];

let demands = [
  {id:1,title:'Corrigir bug no checkout',priority:'high',assignee:'u1',status:'open',created:'2025-10-20',desc:'Erro ao finalizar compra quando cupom aplicado'},
  {id:2,title:'Atualizar base de preços',priority:'medium',assignee:'u2',status:'in_progress',created:'2025-10-22',desc:'Sincronizar com fornecedor XYZ'},
  {id:3,title:'Revisar fluxo de onboarding',priority:'low',assignee:'u3',status:'done',created:'2025-09-30',desc:'Melhorar taxa de conversão no cadastro'}
];

// Persistência demo (localStorage)
const STORAGE_KEY = 'demo_demands_v1';
function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw) demands = JSON.parse(raw);
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(demands)); }

// DOM refs
const tbody = document.getElementById('tbody');
const cardList = document.getElementById('cardList');
const countEl = document.getElementById('count');
const filterAssignee = document.getElementById('filterAssignee');
const inpAssignee = document.getElementById('inpAssignee');

// populate users
function populateUsers(){
  [filterAssignee, inpAssignee].forEach(sel=>{
    sel.innerHTML = '';
    if(sel===filterAssignee){
      const o = document.createElement('option'); o.value=''; o.textContent='Qualquer'; sel.appendChild(o);
    }
    sampleUsers.forEach(u=>{
      const opt = document.createElement('option'); opt.value=u.id; opt.textContent=u.name; sel.appendChild(opt);
    });
  });
}

function statusLabel(s){
  if(s==='open') return '<span class="badge status-open">Pendente</span>';
  if(s==='in_progress') return '<span class="badge status-in">Em andamento</span>';
  return '<span class="badge status-done">Concluído</span>';
}
function priorityLabel(p){
  if(p==='high') return '<span class="badge priority-high">Alta</span>';
  if(p==='medium') return '<span class="badge">Média</span>';
  return '<span class="badge priority-low">Baixa</span>';
}

function renderTable(list){
  tbody.innerHTML='';
  list.forEach(d=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>#${d.id}</td>
      <td><strong>${escapeHTML(d.title)}</strong><div class="small">${escapeHTML(d.desc||'')}</div></td>
      <td>${priorityLabel(d.priority)}</td>
      <td>${(sampleUsers.find(u=>u.id===d.assignee)||{name:'—'}).name}</td>
      <td>${statusLabel(d.status)}</td>
      <td class="small">${d.created}</td>
      <td class="actions">
        <button title="Editar" onclick="openEdit(${d.id})">✎</button>
        <button title="Excluir" onclick="del(${d.id})">🗑</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}
function renderCards(list){
  cardList.innerHTML='';
  list.forEach(d=>{
    const div = document.createElement('div'); div.className='card';
    div.innerHTML = `<div style=\"display:flex;justify-content:space-between;align-items:center\"><div><strong>#${d.id} ${escapeHTML(d.title)}</strong><div class=\"small\">${escapeHTML(d.desc||'')}</div></div><div>${priorityLabel(d.priority)} ${statusLabel(d.status)}</div></div><div style=\"margin-top:8px;display:flex;justify-content:space-between;align-items:center\"><div class=\"small\">Assignee: ${(sampleUsers.find(u=>u.id===d.assignee)||{name:'—'}).name}</div><div><button onclick=\"openEdit(${d.id})\">Editar</button></div></div>`;
    cardList.appendChild(div);
  });
}

function applyFilters(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const priority = document.getElementById('filterPriority').value;
  const assignee = document.getElementById('filterAssignee').value;
  let list = demands.slice();
  if(q) list = list.filter(d=> (d.title||'').toLowerCase().includes(q) || (d.desc||'').toLowerCase().includes(q));
  if(status) list = list.filter(d=>d.status===status);
  if(priority) list = list.filter(d=>d.priority===priority);
  if(assignee) list = list.filter(d=>d.assignee===assignee);
  render(list);
}

function render(list){
  const width = window.innerWidth;
  countEl.textContent = list.length;
  if(width < 880){
    document.getElementById('tableWrap').querySelector('table').style.display='none';
    cardList.style.display='block';
    renderCards(list);
  } else {
    document.getElementById('tableWrap').querySelector('table').style.display='table';
    cardList.style.display='none';
    renderTable(list);
  }
}

// util
function escapeHTML(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// CRUD demo functions
let editingId = null;
function openNew(){ editingId=null; document.getElementById('modalTitle').textContent='Nova Demanda'; document.getElementById('inpTitle').value=''; document.getElementById('inpDesc').value=''; document.getElementById('inpPriority').value='medium'; document.getElementById('inpAssignee').value='u1'; document.getElementById('inpStatus').value='open'; showModal(true); }
function openEdit(id){ const d = demands.find(x=>x.id===id); if(!d) return alert('Não encontrado'); editingId=id; document.getElementById('modalTitle').textContent='Editar Demanda'; document.getElementById('inpTitle').value=d.title; document.getElementById('inpDesc').value=d.desc||''; document.getElementById('inpPriority').value=d.priority; document.getElementById('inpAssignee').value=d.assignee; document.getElementById('inpStatus').value=d.status; showModal(true); }
function del(id){ if(!confirm('Confirma exclusão?')) return; demands = demands.filter(x=>x.id!==id); save(); applyFilters(); }

function saveCurrent(){ const title = document.getElementById('inpTitle').value.trim(); if(!title) return alert('Título obrigatório'); const desc = document.getElementById('inpDesc').value.trim(); const priority = document.getElementById('inpPriority').value; const assignee = document.getElementById('inpAssignee').value; const status = document.getElementById('inpStatus').value;
  if(editingId){ const d = demands.find(x=>x.id===editingId); Object.assign(d,{title,desc,priority,assignee,status}); }
  else { const id = demands.reduce((m,x)=>Math.max(m,x.id),0)+1; demands.push({id,title,desc,priority,assignee,status,created:new Date().toISOString().slice(0,10)}); }
  save(); showModal(false); applyFilters(); }

function showModal(v){ document.getElementById('modalBack').style.display = v ? 'flex' : 'none'; }

// quickSearch
document.getElementById('quickSearch').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  const list = demands.filter(d=> d.title.toLowerCase().includes(q) || (d.desc||'').toLowerCase().includes(q));
  render(list);
});

// events
document.getElementById('btnNew').addEventListener('click', openNew);
document.getElementById('btnCancel').addEventListener('click', ()=>showModal(false));
document.getElementById('btnSave').addEventListener('click', saveCurrent);
document.getElementById('btnApply').addEventListener('click', applyFilters);
document.getElementById('btnClear').addEventListener('click', ()=>{ document.getElementById('q').value=''; document.getElementById('filterStatus').value=''; document.getElementById('filterPriority').value=''; document.getElementById('filterAssignee').value=''; applyFilters(); });
document.getElementById('btnRefresh').addEventListener('click', ()=>{ load(); applyFilters(); });

// init
populateUsers(); load(); applyFilters();

// expose for inline handlers
window.openEdit = openEdit; window.del = del;

// Notes: para integrar com backend, remova localStorage e faça fetch() para seus endpoints.
</script>
</body>
</html>
