<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - App de Demandas</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <!-- Ícones do Bootstrap -->
  <link 
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >
</head>

<body class="bg-dark d-flex align-items-center justify-content-center" style="height:100vh;">

  <div class="col-md-4">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">

          <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill fs-1 text-success"></i>
            <h3 class="mt-2">Cadastro de {{tipo}}</h3>
            <p class="text-muted">Crie sua conta</p>
          </div>

          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Nome completo</label>
              <div class="input-group">
                <span class="input-group-text bg-success text-white">
                  <i class="bi bi-person-vcard"></i>
                </span>
                <input type="text" name="nome" class="form-control" placeholder="Seu nome">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <div class="input-group">
                <span class="input-group-text bg-success text-white">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="email" name="email" class="form-control" placeholder="email@exemplo.com">
              </div>
            </div>

             <div class="mb-3">
              <label class="form-label">Usuário</label>
              <div class="input-group">
                <span class="input-group-text bg-success text-white">
                  <i class="bi bi-person"></i>
                </span>
                <input type="text" name="nomeUsuario" class="form-control" placeholder="ex: joao123">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Senha</label>
              <div class="input-group">
                <span class="input-group-text bg-success text-white">
                  <i class="bi bi-lock-fill"></i>
                </span>
                <input type="password" name="senha" class="form-control" placeholder="••••••">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Confirmar senha</label>
              <div class="input-group">
                <span class="input-group-text bg-success text-white">
                  <i class="bi bi-lock-fill"></i>
                </span>
                <input type="password" class="form-control" placeholder="••••••">
              </div>
            </div>

            <button class="btn btn-success w-100 mt-2">Cadastrar</button>

          </form>

          <div class="text-center mt-3">
            <a href="{% url 'home' %}" class="text-decoration-none">Já tem conta? Entrar</a>
          </div>

        </div>
      </div>

  </div>

</body>
</html>
