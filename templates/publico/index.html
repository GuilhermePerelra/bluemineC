<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - App de Demandas</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <!-- Ícones do Bootstrap -->
  <link 
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >
</head>

<body class="bg-dark d-flex align-items-center justify-content-center" style="height:100vh;">

  <div class="col-md-4">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">

          <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-primary"></i>
            <h3 class="mt-2">Login</h3>
            <p class="text-muted">Acesse sua conta</p>
          </div>

          <form action="" method="post">
            {% csrf_token %}
            
            <div class="mb-3">
              <label class="form-label">Usuário</label>
              <div class="input-group">
                <span class="input-group-text bg-primary text-white">
                  <i class="bi bi-person"></i>
                </span>
                <input type="text" class="form-control" placeholder="admin">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Senha</label>
              <div class="input-group">
                <span class="input-group-text bg-primary text-white">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control" placeholder="••••••">
              </div>
            </div>

            <button class="btn btn-primary w-100 mt-2">Entrar</button>

          </form>

          <div class="text-center mt-3">
            <a href="{% url 'cadastro' 'colaborador' %}" class="text-decoration-none m-3">Cadastro de Colaborador</a>
            <a href="{% url 'cadastro' 'responsavel' %}" class="text-decoration-none m-3">Cadastro de Responsável</a>
          </div>

        </div>
      </div>

  </div>

</body>
</html>
